# Aura Workspace backend (Render Free).
# Python 3.13 is pinned in backend/runtime.txt (python-3.13).
# NumPy 2.5 requires Python >= 3.12; 3.13 matches the verified local runtime.
# Render's native runtime reads PYTHON_VERSION at the service root, so that
# env var mirrors runtime.txt with a fully qualified 3.13 patch.
services:
  - type: web
    name: aura-workspace-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: AURA_ENV
        value: production
      - key: AURA_API_SECRET
        generateValue: true
      - key: AURA_ALLOWED_HOSTS
        value: aura-workspace-api.onrender.com
      - key: AURA_MAX_CONCURRENT
        value: "4"
